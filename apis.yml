name: Corvia Medical
description: Corvia Medical, Inc. is a medical device company headquartered in Tewksbury,
  Massachusetts that develops interventional cardiology solutions for heart failure.
  Its lead product is the Corvia Atrial Shunt System (IASD), a transcatheter implant
  indicated for improving quality of life and reducing heart-failure symptoms in patients
  with elevated left atrial pressures who remain symptomatic despite guideline-directed
  medical therapy. The company has been backed by General Catalyst since 2009. Corvia
  Medical publishes no public API, developer portal, or machine-readable interface;
  its web presence is clinical, patient, and regulatory information only.
